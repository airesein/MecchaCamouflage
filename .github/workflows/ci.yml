name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      BUILD_VERSION: ci-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init required submodules
        shell: powershell
        run: git submodule update --init --recursive third_party/minhook

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache WebView2 bootstrapper
        uses: actions/cache@v4
        with:
          path: .build/cache
          key: webview2-${{ runner.os }}-${{ hashFiles('scripts/build.ps1') }}
          restore-keys: webview2-${{ runner.os }}-

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build runtime
        shell: powershell
        run: .\scripts\build.ps1 -Version $env:BUILD_VERSION -ShowTimings

      - name: Build artifact checks
        shell: powershell
        run: |
          if (-not (Test-Path ".build/bin/meccha-camouflage.exe")) { throw "runtime exe missing" }
          $nativeDir = ".build/obj/$env:BUILD_VERSION/package-native"
          if (-not (Test-Path "$nativeDir/runtime-bridge.dll")) { throw "runtime bridge dll missing" }
          if (-not (Test-Path "$nativeDir/runtime-injector.exe")) { throw "runtime injector exe missing" }
          if (Test-Path "$nativeDir/bridge-loader.dll") { throw "bridge loader must not be packaged" }
          if (Test-Path "src/native/loader/loader.cpp") { throw "obsolete loader source must not return" }
          if (Test-Path "src/native/include/bridge_loader_abi.hpp") { throw "obsolete loader ABI must not return" }

      - name: Package dry run
        shell: powershell
        run: |
          .\scripts\release.ps1 -Version $env:BUILD_VERSION
          $exePath = ".build/package/meccha-camouflage-$($env:BUILD_VERSION).exe"
          if (-not (Test-Path $exePath)) { throw "package exe missing" }
          if ((Get-Item $exePath).Length -le 10000000) { throw "package exe is unexpectedly small" }
          .\scripts\verify-runtime-bundle.ps1 `
            -ExePath $exePath `
            -ExpectedVersion $env:BUILD_VERSION `
            -BridgePath ".build/obj/$env:BUILD_VERSION/package-native/runtime-bridge.dll" `
            -ProfileDirectory "resources/mesh-profiles"

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: meccacamouflage
          path: .build/package/meccha-camouflage-*.exe
          if-no-files-found: error
